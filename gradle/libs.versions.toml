[versions]
junit = "5.10.1"
netty = "4.1.105.Final"
mdcfg = "2.1.0"
mdlib = "1.6.0"
mcore = "2.0.0-pre6"
slf4j = "2.0.11"
jbr-anno = "24.0.1"
auth = "6.0.52"
guava = "33.0.0-jre"
shadow = "8.1.1"
jwt = "4.4.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
midnight-cfg = { module = "dev.jwall64:midnightcfg-api", version.ref="mdcfg" }
midnight-cfg-json = { module = "dev.jwall64:midnightcfg-codec-json", version.ref="mdcfg" }
midnight-cfg-nbt = { module = "dev.jwall64:midnightcfg-codec-nbt", version.ref="mdcfg" }
midnight-lib = { module = "dev.jwall64:midnightlib", version.ref="mdlib" }
midnight-core = { module = "dev.jwall64:midnightcore-common", version.ref="mcore" }
mojang-authlib = { module = "com.mojang:authlib", version.ref="auth" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref="jbr-anno" }
google-guava = { module = "com.google.guava:guava", version.ref="guava" }
auth0-jwt = { module = "com.auth0:java-jwt", version.ref="jwt" }

[plugins]
shadow = { id = "com.github.johnrengelman.shadow", version.ref = "shadow" }
