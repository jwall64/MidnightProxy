apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcstatusentries.mdproxy.jwall64.dev
spec:
  group: mdproxy.jwall64.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                priority:
                  type: integer
                  default: 0
                players_verride:
                  type: integer
                  nullable: true
                max_players_override:
                  type: integer
                  nullable: true
                player_sample:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      username:
                        type: string
                      uuid:
                        type: string
                        format: uuid
                message:
                  type: string
                  nullable: true
                icon:
                  type: string
                  nullable: true
                secure_chat:
                  type: boolean
                  nullable: true
                previews_chat:
                  type: boolean
                  nullable: true
                passthrough:
                  type: string
                  nullable: true
                requirement:
                  type: string
                  nullable: true
  scope: Namespaced
  names:
    plural: mcstatusentries
    singular: mcstatusentry
    kind: MinecraftStatusEntry
    shortNames:
      - mcse
