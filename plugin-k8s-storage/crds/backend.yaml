apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcbackends.mdproxy.jwall64.dev
spec:
  group: mdproxy.jwall64.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [ "hostname" ]
              properties:
                hostname:
                  type: string
                port:
                  type: integer
                  default: 25565
                  minimum: 0
                  maximum: 65535
                redirect:
                  type: boolean
                  default: false
                haproxy:
                  type: boolean
                  default: false
                meta:
                  type: object
                  additionalProperties:
                    type: string
                  default: {}
  scope: Namespaced
  names:
    plural: mcbackends
    singular: mcbackend
    kind: MinecraftBackend
    shortNames:
      - mcb
