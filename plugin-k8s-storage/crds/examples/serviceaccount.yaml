apiVersion: v1
kind: ServiceAccount
metadata:
  name: midnightproxy-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: midnightproxy-role
rules:
  - apiGroups: ["mdproxy.jwall64.dev"]
    resources: ["mcroutes", "mcbackends", "mcauthroutes", "mcstatusentries" ]
    verbs: ["get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: midnightproxy-rb
subjects:
  - kind: ServiceAccount
    name: midnightproxy-sa
roleRef:
  kind: Role
  name: midnightproxy-role
  apiGroup: rbac.authorization.k8s.io
