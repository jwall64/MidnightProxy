apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcroutes.mdproxy.jwall64.dev
spec:
  group: mdproxy.jwall64.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["backend"]
              properties:
                backend:
                  x-kubernetes-preserve-unknown-fields: true
                requirement:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    type:
                      type: string
                    invert:
                      type: boolean
                    success_meta:
                      type: object
                      additionalProperties:
                        type: string
                      default: {}
                    fail_meta:
                      type: object
                      additionalProperties:
                        type: string
                      default: {}
                kick_on_fail:
                  type: boolean
                  default: false
                kick_message:
                  type: string
                  nullable: true
                balance_strategy:
                  type: string
                  enum: ["round_robin", "min_connections"]
                  default: "round_robin"
                priority:
                  type: integer
                  default: 0
  scope: Namespaced
  names:
    plural: mcroutes
    singular: mcroute
    kind: MinecraftRoute
    shortNames:
      - mcrt
