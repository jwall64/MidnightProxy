api: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.mdproxy.jwall64.dev
spec:
  group: mdproxy.jwall64.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            backends:
              type: array
              items:
                type: object
                properties:
                  name:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          hostname:
                            type: string
                          port:
                            type: integer
                            default: 25565
                          redirect:
                            type: boolean
                            default: false
                          haproxy:
                            type: boolean
                            default: false
            requirement:
              type: string
              nullable: true
            kickOnFail:
              type: boolean
              default: false
            kickMessage:
              type: string
              nullable: true
            balanceStrategy:
              type: string
              enum: ["round_robin", "min_connections"]
              default: "round_robin"
            priority:
              type: integer
              default: 0
  scope: Namespaced
  names:
    plural: routes
    singular: route
    kind: MinecraftRoute
    shortNames:
      - mcrt
